[package]
name = "ratmax"
version = "0.2.1"
edition = "2024"
license = "0BSD"
publish = false
default-run = "ratmax"
readme = "README.md"
description = "Bloody W95 Max configuration, macro, RGB lighting, and firmware TUI/CLI"
exclude = ["evidence/"]

[[bin]]
name = "ratmax"
path = "src/main.rs"

[features]
default = ["linux-query"]
linux-query = ["dep:hidapi", "dep:rustix", "dep:rusb"]

[dependencies]
crossterm = { version = "0.29", default-features = false, features = ["events"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "=2.6.7", default-features = false, features = ["linux-native"], optional = true }
rusb = { version = "=0.9.4", optional = true }

[target.'cfg(target_os = "linux")'.dependencies.rustix]
version = "1"
features = ["fs"]
optional = true

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
